version: 1
project:
  name: buzz
  description: >
    Pressure contract for Buzz's Docker Compose-backed Rust integration path. It intentionally
    proves that stock Ota OCI enforcement refuses this service, migration, and persistent-state
    closure before any provider or repository mutation.
  type: application

metadata:
  ota:
    minimum_version: "1.6.25"

execution:
  supported:
    - container
  default_context: integration:container
  lifecycle: ephemeral
  backends:
    container:
      image: rust:1.95-bookworm
      platform: linux/amd64
      engines:
        - docker
  runtime_boundary:
    filesystem:
      repo_root_mode: read_only
      writable_paths:
        - target
      protected_paths:
        - ota.yaml
        - docker-compose.yml
        - migrations
        - .github
    network:
      default: deny
  contexts:
    integration:container:
      backend: container
      lifecycle: ephemeral

toolchains:
  rust:
    version: "1.95.0"
    fulfillment:
      mode: none

tools:
  docker:
    version: "*"
  just:
    version: "*"

services:
  postgres:
    required: true
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: postgres
    lifecycle:
      teardown_assertion: manager_inactive
  redis:
    required: true
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: redis
    lifecycle:
      teardown_assertion: manager_inactive
  adminer:
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: adminer
    lifecycle:
      teardown_assertion: manager_inactive
  keycloak:
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: keycloak
    lifecycle:
      teardown_assertion: manager_inactive
  minio:
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: minio
    lifecycle:
      teardown_assertion: manager_inactive
  minio-init:
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: minio-init
    lifecycle:
      teardown_assertion: manager_inactive
  prometheus:
    manager:
      kind: compose
      name: buzz
      file: docker-compose.yml
      service: prometheus
    lifecycle:
      teardown_assertion: manager_inactive

tasks:
  setup:rust-dependencies:
    context: integration:container
    category: setup
    description: Fetch the Cargo dependency graph required by Buzz's integration test closure
    notes: >
      This is the declared dependency-hydration stage. The upstream `just test-integration` helper
      also reaches Hermit-managed tools internally; stock oci_local refuses before either path can
      hydrate state because it cannot place this preparation inside its enforced command boundary.
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: cargo
        cwd: .
    requirements:
      toolchains:
        - rust
    effects:
      adapter_state:
        - cargo_cache:registry
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true

  test:integration:
    context: integration:container
    category: test
    description: Run Buzz's canonical integration suite through its documented Just recipe
    notes: >
      `just test-integration` delegates to scripts/run-tests.sh, which invokes the private
      `_ensure-migrations` recipe. That helper starts the full Compose topology, may pull images,
      runs Postgres migrations, and seeds local state. This is intentionally not flattened into
      a synthetic green command: stock oci_local must refuse its declared pre-boundary service and
      requirement work before Docker, migrations, hydration, hooks, or the test body can start.
    depends_on:
      - setup:rust-dependencies
    requires_services:
      - postgres
      - redis
      - adminer
      - keycloak
      - minio
      - minio-init
      - prometheus
    command:
      exe: just
      args:
        - test-integration
    requirements:
      toolchains:
        - rust
      tools:
        docker: "*"
        just: "*"
    effects:
      writes:
        - target
      adapter_state:
        - cargo_cache:registry
        - compose_network:buzz-net
        - compose_volume:buzz-postgres-data
        - compose_volume:buzz-minio-data
        - compose_volume:buzz-prometheus-data
      network: true
      network_kind: integration_test
      external_state:
        - docker
        - postgres
        - redis
        - s3
    safe_for_agent: true

workflows:
  default: integration
  integration:
    intent: verification
    description: >
      Dependency hydration plus the public Compose-backed integration-test path. The first stock
      oci_local adapter intentionally refuses this workflow before setup because it cannot enforce
      the required services or requirements inside the selected task boundary.
    run:
      task: test:integration

agent:
  posture: readiness_strict
  entrypoint: test:integration
  default_task: test:integration
  safe_tasks:
    - setup:rust-dependencies
    - test:integration
  writable_paths:
    - target
  protected_paths:
    - ota.yaml
    - docker-compose.yml
    - migrations
    - .github
  bootstrap:
    ota:
      note: This active pressure contract is pinned to the exact unreleased Ota Core revision under test.
      source:
        kind: git_rev
        rev: 8de7d34db7c74def6944712d356ddcb4ab0e9ab2
  notes: >
    This is a bounded unsupported-capability pressure contract, not a claim that Ota governs all
    Buzz setup, desktop, relay, deployment, credential, or persistent-state behavior. Use the
    sandboxed agent commands below to verify refusal before mutation; do not use this contract to
    run the integration suite natively.
